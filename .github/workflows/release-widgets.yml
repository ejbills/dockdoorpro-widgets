name: Deploy Widgets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Widgets/**'
      - 'Docks/**'
      - 'scripts/**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: macos-14
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate widget folders
        run: python3 scripts/validate-widgets.py

      - name: Validate docks
        run: python3 scripts/validate-docks.py

      - name: Build all widgets
        run: bash scripts/build-widgets.sh

      - name: Generate manifest
        run: python3 scripts/generate-manifest.py

      - name: Generate docks catalog
        run: python3 scripts/generate-docks-catalog.py

      - name: Prepare site
        run: |
          mkdir -p _site/bundles
          cp manifest.json _site/
          cp build/*.bundle.zip _site/bundles/
          cp build/docks.json _site/
          cp -R build/docks _site/docks
          if [ -d build/previews ]; then cp -R build/previews _site/previews; fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
