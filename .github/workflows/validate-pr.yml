name: Validate PR

on:
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    # macos-26 ships Xcode 26+, whose SDK includes the FoundationModels
    # framework the Ask widget imports.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      # Folder names, widget.json fields, folder contents (widget.json plus the
      # listed top-level .swift files, nothing else) and the unsafe-API lint over
      # exactly the files the build compiles. Runs before anything is built.
      - name: Validate widget folders
        run: python3 scripts/validate-widgets.py

      - name: Build widgets
        run: bash scripts/build-widgets.sh
